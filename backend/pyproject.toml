[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-inventory"
version = "0.1.0"
description = "Household Food Inventory API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "sqlalchemy==2.0.36.*",
    "pydantic==2.6.*",
    "pydantic-settings==2.2.*",
    "pyjwt==2.10.*",
    "pwdlib[argon2]==0.3.*",
    "psycopg[pool]==3.1.*",
    "alembic==1.13.*",
    "uvicorn==0.32.*",
    "python-multipart==0.0.12.*",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.*",
    "pytest-asyncio==0.21.*",
    "httpx==0.27.*",
    "testcontainers==4.5.*",
    "schemathesis==3.14.*",
    "pytest-mock==3.12.*",
    "pytest-cov==4.1.*",
    "ruff==0.5.*",
    "mypy==1.9.*",
]

[tool.uv]
dev-dependencies = [
    "pytest==7.4.*",
    "pytest-asyncio==0.21.*",
    "httpx==0.27.*",
    "testcontainers==4.5.*",
    "pytest-mock==3.12.*",
    "pytest-cov==4.1.*",
    "ruff==0.5.*",
    "mypy==1.9.*",
    "werkzeug==2.3.*",
    "email-validator==2.1.*",
    "cryptography>=50.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "C4", "DTZ", "ERA", "ICN", "LOG", "N", "PD", "PGH", "PIE", "PL", "PT", "Q", "RSE", "RET", "SIM", "T20", "TCH", "TRY", "UP", "YTT"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN401", "ARG001", "ARG002"]
fixable = ["F", "I", "UP", "W"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
